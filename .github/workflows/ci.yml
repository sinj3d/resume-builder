name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 7 requires Node 20.19+/22.12+
          cache: npm
      - run: npm ci
      - run: npm run build # tsc && vite build

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-24.04 # match the release Linux runner; ort's prebuilt ONNX Runtime needs glibc >= 2.38
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      # tauri::generate_context! embeds frontendDist (../dist) at macro-expansion
      # time; an empty dir suffices for cargo check.
      - name: Create empty frontend dist
        run: mkdir -p dist
      - name: cargo test (LaTeX tests are Windows-only + network-bound; run locally)
        working-directory: src-tauri
        run: 'cargo test --locked -- --skip latex::'

  prompt-parity:
    name: Prompt parity (python selftest)
    runs-on: ubuntu-latest
    env:
      RESUME_DB: /tmp/resume_builder.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python training/prompt_builder.py --selftest
